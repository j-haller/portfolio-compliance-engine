services:

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - dashboard
      - api

  dashboard:
    build: ./dashboard
    volumes:
      - ./dashboard:/app
      - ./db:/db
      - ./data:/data
      - ./engine:/engine
    environment:
      - API_BASE_URL=http://api:5050
      - DB_PATH=/db/compliance_engine.db
      - PYTHONPATH=/engine
    depends_on:
      - api

  api:
    build: ./api
    volumes:
      - ./api:/app
      - ./db:/db
    environment:
      - DB_PATH=/db/compliance_engine.db
      - ASPNETCORE_URLS=http://+:5050
    depends_on:
      db-init:
        condition: service_completed_successfully

  db-init:
    image: keinos/sqlite3
    user: root
    volumes:
      - ./db:/db
    command: >
      sh -c "sqlite3 /db/compliance_engine.db < /db/schema.sql &&
             if [ \$(sqlite3 /db/compliance_engine.db 'SELECT COUNT(*) FROM rule') = '0' ]; then
               sqlite3 /db/compliance_engine.db < /db/seed.sql;
             fi"
